name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # shellcheck is preinstalled on ubuntu-latest runners.
      # TODO: scripts/setup.sh has 2 SC2016 (info) findings on the node -e
      # heredocs (lines ~89/144 — single-quoted on purpose, shell vars are passed
      # via env not expansion). Baseline = info-only, no warnings/errors. Flip
      # continue-on-error to false once those are addressed so this job gates.
      - name: ShellCheck shipped scripts
        continue-on-error: true
        run: shellcheck scripts/post-tool-use.sh scripts/pre-commit.sh scripts/setup.sh

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Surfaces supply-chain advisories on PRs (production deps only), before
      # the release pipeline's own audit gate. Baseline: 0 vulnerabilities.
      - name: Security audit (production deps)
        run: npm audit --omit=dev

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - name: Upload coverage report
        if: always() && matrix.node-version == 22
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage/

  benchmark:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run benchmark gate
        run: node benchmark/ci-gate.mjs
